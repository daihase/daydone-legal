<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayDone サポート</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: #F9F9F9;
      color: #283237;
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 56px 20px 32px;
    }
    .hero {
      text-align: center;
      margin-bottom: 28px;
    }
    .app-icon {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(40, 50, 55, 0.12);
      margin-bottom: 16px;
    }
    .app-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }
    .sub {
      color: #8CA0A8;
      font-size: 14px;
      margin-top: 4px;
    }
    .card {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 1px 4px rgba(40, 50, 55, 0.05);
      border: 1px solid #E8E9EC;
    }
    h2 {
      font-size: 16px;
      font-weight: 600;
      color: #283237;
      margin-bottom: 10px;
    }
    h2:not(:first-of-type) { margin-top: 28px; }
    p {
      font-size: 15px;
      color: #566973;
      margin-bottom: 12px;
    }
    .step {
      display: inline-block;
      padding: 10px 16px;
      background: #F9F9F9;
      border-radius: 10px;
      font-size: 14px;
      color: #283237;
      font-weight: 500;
      border: 1px solid #E8E9EC;
    }
    .accent {
      color: #427E86;
      font-weight: 700;
      margin: 0 4px;
    }
    .links {
      list-style: none;
      padding: 0;
    }
    .links li { margin-bottom: 6px; }
    .links a {
      color: #427E86;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }
    .links a:hover { text-decoration: underline; }
    footer {
      margin-top: 32px;
      text-align: center;
      color: #B0BABF;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <img class="app-icon" src="app_icon.png" alt="DayDone">
      <div class="app-name">DayDone</div>
      <div class="sub">サポート</div>
    </div>

    <div class="card">
      <h2>お問い合わせ</h2>
      <p>DayDone に関するご質問・ご要望・不具合のご報告は、アプリ内のお問い合わせフォームよりお送りください。</p>
      <p>
        <span class="step">マイページ<span class="accent">→</span>お問い合わせ</span>
      </p>

      <h2>関連リンク</h2>
      <ul class="links">
        <li><a href="terms.html">利用規約</a></li>
        <li><a href="privacy.html">プライバシーポリシー</a></li>
      </ul>
    </div>

    <footer>
      &copy; 2026 daihase
    </footer>
  </div>
</body>
</html>
